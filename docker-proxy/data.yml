  shortDescZh: "自建的 Docker 镜像加速与管理服务，零磁盘缓存，内置 HubCMD-UI 可视化面板。"
  shortDescEn: "A self-hosted Docker image acceleration and management service with zero disk cache and the HubCMD-UI panel."
  description:
    en: "A self-hosted Docker image acceleration and management service that routes pulls for Docker Hub, GHCR, Quay, K8s, MCR, Elastic and NVCR by request Host with zero disk cache and streaming forwarding, plus the HubCMD-UI management panel."
    es-es: "Un servicio autoalojado de aceleracion y gestion de imagenes Docker que enruta las descargas de Docker Hub, GHCR, Quay, K8s, MCR, Elastic y NVCR segun el Host de la peticion, sin cache en disco y con reenvio en streaming, ademas del panel de gestion HubCMD-UI."
    ja: "リクエストの Host に応じて Docker Hub、GHCR、Quay、K8s、MCR、Elastic、NVCR のプルをルーティングし、ディスクキャッシュなしでストリーミング転送するセルフホスト型の Docker イメージ高速化・管理サービスです。HubCMD-UI 管理パネルを同梱します。"
    ms: "Perkhidmatan pecutan dan pengurusan imej Docker hos kendiri yang mengarahkan tarikan bagi Docker Hub, GHCR, Quay, K8s, MCR, Elastic dan NVCR mengikut Host permintaan dengan sifar cache cakera dan pemajuan penstriman, serta panel pengurusan HubCMD-UI."
    pt-br: "Um servico auto-hospedado de aceleracao e gerenciamento de imagens Docker que roteia pulls do Docker Hub, GHCR, Quay, K8s, MCR, Elastic e NVCR pelo Host da requisicao, com zero cache em disco e encaminhamento em streaming, alem do painel de gerenciamento HubCMD-UI."
    ru: "Самостоятельно размещаемый сервис ускорения и управления образами Docker: маршрутизирует загрузки из Docker Hub, GHCR, Quay, K8s, MCR, Elastic и NVCR по Host запроса, без дискового кеша и с потоковой передачей, плюс панель управления HubCMD-UI."
    ko: "요청 Host 에 따라 Docker Hub, GHCR, Quay, K8s, MCR, Elastic, NVCR 의 풀을 라우팅하고 디스크 캐시 없이 스트리밍으로 전달하는 셀프 호스팅 Docker 이미지 가속 및 관리 서비스이며 HubCMD-UI 관리 패널을 포함합니다."
    zh-Hant: "自建的 Docker 鏡像加速與管理服務，依請求 Host 將 Docker Hub、GHCR、Quay、K8s、MCR、Elastic、NVCR 的拉取自動路由並以串流轉發，零磁碟快取，內建 HubCMD-UI 視覺化管理面板。"
    zh: "自建的 Docker 镜像加速与管理服务，按请求 Host 将 Docker Hub、GHCR、Quay、K8s、MCR、Elastic、NVCR 的拉取自动路由并流式转发，零磁盘缓存，内置 HubCMD-UI 可视化管理面板。"
    tr: "Docker Hub, GHCR, Quay, K8s, MCR, Elastic ve NVCR cekmelerini istek Host'una gore yonlendiren, disk onbellegi olmadan akis halinde ileten kendi barindirdiginiz Docker imaj hizlandirma ve yonetim hizmeti; HubCMD-UI yonetim paneli ile birlikte."
