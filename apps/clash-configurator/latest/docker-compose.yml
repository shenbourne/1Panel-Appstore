services:
  clash-configurator:
    image: shenbourne/clash-configurator:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
    - ${APP_BIND_IP}:${PANEL_APP_PORT_HTTP}:3000
    environment:
      NODE_ENV: production
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
    - ./data/configs:/app/server/data/configs
    - ./data/rule-sets:/app/server/data/rule-sets
    - ./data/temp:/app/server/data/temp
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
