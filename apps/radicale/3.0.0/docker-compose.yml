name: Radicale
services:
  radicale:
    image: ghcr.io/kozea/radicale:stable
    ports:
      - ${PANEL_APP_PORT_HTTP}:5232
    volumes:
      - ./config:/etc/radicale
      - ./data:/var/lib/radicale
    container_name: ${CONTAINER_NAME}
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
volumes:
  config:
    name: radicale-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./config
  data:
    name: radicale-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
networks:
  1panel-network:
    external: true
