services:
  tool-nest:
    image: shenbourne/tool-nest:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
    - ${APP_BIND_IP}:${PANEL_APP_PORT_HTTP}:3000
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATA_DIR: /app/data
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
    - toolnest-data:/app/data
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
volumes:
  toolnest-data: {}
