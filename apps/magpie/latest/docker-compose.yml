services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    command: ["web", "--addr", "0.0.0.0:3430", "--no-open"]
    ports:
      - "${MAGPIE_BIND_IP:-0.0.0.0}:${PANEL_APP_PORT_HTTP}:3430"
      - "${MAGPIE_BIND_IP:-0.0.0.0}:${PANEL_APP_PORT_GATEWAY}:3425"
    environment:
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_WEB_KEY: "${MAGPIE_WEB_KEY:?Set a management key of at least 16 characters}"
      MAGPIE_PUBLIC_URL: "${MAGPIE_PUBLIC_URL:-}"
    volumes:
      - magpie-config:/config
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
volumes:
  magpie-config:
networks:
  1panel-network:
    external: true
