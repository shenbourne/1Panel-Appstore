name: Validate catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate 1Panel application packages
        run: python scripts/validate.py
      - name: Verify scripts and import behavior
        run: |
          bash -n scripts/sync.sh scripts/install.sh scripts/bootstrap.sh tests/sync.sh
          bash tests/sync.sh
